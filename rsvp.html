<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Who's Coming · Heart Huddle</title>
  <link rel="icon" href="hearthuddle-icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --cream: #f5f0e8;
      --cream-dark: #ede7d9;
      --flame: #e05218;
      --flame-soft: #d4621a;
      --ember: #b84a10;
      --ink: #2d2826;
      --ink-soft: #5a4f47;
      --rule: rgba(45,40,38,0.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; }

    body {
      background-color: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 5rem;
    }

    /* ── header ── */
    .header {
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeUp 0.7s ease both;
    }

    .header img.icon {
      width: 52px;
      height: 52px;
      object-fit: contain;
      margin-bottom: 1rem;
      filter: drop-shadow(0 2px 6px rgba(224,82,24,0.25));
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.9rem, 5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.1;
      color: var(--ink);
    }

    .header h1 span {
      color: var(--flame);
      font-style: italic;
    }

    .header .sub {
      margin-top: 0.6rem;
      font-size: 0.9rem;
      font-weight: 400;
      color: var(--ink-soft);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* ── card ── */
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 24px rgba(45,40,38,0.08), 0 1px 4px rgba(45,40,38,0.06);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      animation: fadeUp 0.7s 0.15s ease both;
    }

    .card-header {
      background: var(--ink);
      color: var(--cream);
      padding: 1.1rem 1.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-header .label {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1rem;
      opacity: 0.85;
    }

    .card-header .count-pill {
      background: var(--flame);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.75rem;
      border-radius: 99px;
    }

    .names-list {
      padding: 0.5rem 0;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.75rem 1.6rem;
      border-bottom: 1px solid var(--rule);
      opacity: 0;
      transform: translateX(-8px);
      animation: slideIn 0.4s ease forwards;
    }

    .name-row:last-child { border-bottom: none; }

    .flame-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--flame);
      flex-shrink: 0;
      opacity: 0.7;
    }

    .name-text {
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--ink);
    }

    /* empty / loading / error states */
    .state-msg {
      padding: 2.5rem 1.6rem;
      text-align: center;
      color: var(--ink-soft);
      font-size: 0.95rem;
      font-style: italic;
    }

    /* ── footer note ── */
    .note {
      margin-top: 2rem;
      max-width: 420px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--ink-soft);
      line-height: 1.6;
      animation: fadeUp 0.7s 0.3s ease both;
    }

    .note a {
      color: var(--flame);
      text-decoration: none;
      font-weight: 500;
    }

    .note a:hover { text-decoration: underline; }

    /* ── divider ── */
    .divider {
      width: 40px;
      height: 2px;
      background: var(--flame);
      border-radius: 2px;
      margin: 1rem auto 0;
      opacity: 0.4;
    }

    /* ── animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      to { opacity: 1; transform: translateX(0); }
    }

    /* stagger name rows */
    .name-row:nth-child(1)  { animation-delay: 0.30s }
    .name-row:nth-child(2)  { animation-delay: 0.38s }
    .name-row:nth-child(3)  { animation-delay: 0.46s }
    .name-row:nth-child(4)  { animation-delay: 0.54s }
    .name-row:nth-child(5)  { animation-delay: 0.62s }
    .name-row:nth-child(6)  { animation-delay: 0.70s }
    .name-row:nth-child(7)  { animation-delay: 0.78s }
    .name-row:nth-child(8)  { animation-delay: 0.86s }
    .name-row:nth-child(9)  { animation-delay: 0.94s }
    .name-row:nth-child(10) { animation-delay: 1.02s }
  </style>
</head>
<body>

  <header class="header">
    <img class="icon" src="hearthuddle-icon.png" alt="Heart Huddle flame icon" />
    <h1>Who's <span>coming</span></h1>
    <p class="sub">Heart Huddle · Thursday evenings · Santa Cruz</p>
    <div class="divider"></div>
  </header>

  <div class="card">
    <div class="card-header">
      <span class="label">This week's circle</span>
      <span class="count-pill" id="count">loading…</span>
    </div>
    <div class="names-list" id="names-list">
      <div class="state-msg">Gathering the circle…</div>
    </div>
  </div>

  <p class="note">
    Space is limited to 10 women.<br>
    <a href="https://buttondown.com/hearthuddle">Subscribe to get the invite</a> and RSVP each week.<br>
    Last-minute spots welcome — the list updates in real time.
  </p>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxSDEIzFgXmGTF1IrDTs6ThgTF9SeDa4J27pNHBUVyBR2Jy_05IBdTL6E0LnMv_JLSIJg/exec';

    async function loadNames() {
      const list = document.getElementById('names-list');
      const countEl = document.getElementById('count');

      try {
        const res = await fetch(SCRIPT_URL);
        if (!res.ok) throw new Error('Network response was not ok');
        const data = await res.json();
        const names = data.names || [];

        if (names.length === 0) {
          list.innerHTML = '<div class="state-msg">No RSVPs yet — be the first! 🔥</div>';
          countEl.textContent = `0 / ${data.limit || 9}`;
          return;
        }

        countEl.textContent = `${names.length} / ${data.limit || 9}`;

        list.innerHTML = names.map(name => `
          <div class="name-row">
            <div class="flame-dot"></div>
            <span class="name-text">${name}</span>
          </div>
        `).join('');

      } catch (err) {
        list.innerHTML = '<div class="state-msg">Couldn\'t load the list right now — check back soon.</div>';
        countEl.textContent = '—';
        console.error('RSVP fetch error:', err);
      }
    }

    loadNames();
  </script>

</body>
</html>
